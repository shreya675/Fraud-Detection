name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # The suite trains a small model on synthetic data, so it does not
        # need the 470 MB PaySim CSV. API endpoints are exercised via TestClient.
        run: pytest -q --cov=src/fraudguard --cov=api --cov=dashboard --cov-report=term-missing

  docker:
    name: Verify Docker build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the images from a freshly trained synthetic model so the check
      # does not depend on the committed artifacts, then make sure the API
      # container starts and answers /health and /predict.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Produce build-time artifacts (synthetic quick model)
        run: |
          pip install -r requirements-dev.txt && pip install -e .
          python - <<'EOF'
          from tests.synthetic import make_synthetic_paysim
          from fraudguard.data import clean, drop_non_features, time_aware_split
          from fraudguard import train
          cleaned, _ = clean(make_synthetic_paysim(6000))
          train.run(splits=time_aware_split(drop_non_features(cleaned)), quick=True)
          EOF

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: fraudguard-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile
          push: false
          load: true
          tags: fraudguard-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test API container
        run: |
          docker run -d --name api -p 8000:8000 fraudguard-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"model_loaded":true'
          curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"transaction":{"step":300,"type":"TRANSFER","amount":181,"oldbalanceOrg":181,"newbalanceOrig":0,"oldbalanceDest":0,"newbalanceDest":0}}' \
            | grep -q '"fraud_probability"'
          docker logs api --tail 20
          docker rm -f api
